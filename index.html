```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Date</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>💜 Blind Date</h1>
    <p>Find your mystery match!</p>
  </header>

  <main>
    <section class="card">
      <h2>🎲 Mystery Match</h2>
      <p>
        Answer a few questions and we'll give you a mystery match
        based on your interests.
      </p>

      <button onclick="startMatch()">Start Matching</button>
    </section>

    <section id="quiz" class="card hidden">
      <h2 id="question">Question</h2>

      <div id="answers"></div>
    </section>

    <section id="result" class="card hidden">
      <h2>✨ Your Match!</h2>

      <div class="match">
        <div class="avatar">?</div>
        <h2 id="matchName">Mystery Person</h2>
        <p id="matchInfo"></p>
      </div>

      <button onclick="restart()">Try Again</button>
    </section>
  </main>

  <footer>
    <p>Blind Date • Mystery matches for making new friends</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
```
